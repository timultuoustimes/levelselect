name: LevelSelect
options:
  bundleIdPrefix: com.levelselect
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "GYDB3WFZB2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    PROVISIONING_PROFILE_SPECIFIER: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LevelSelect
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  LevelSelect:
    type: application
    supportedDestinations: [iOS, iPadOS, macOS]
    # CloudKit entitlements are ready to enable (see README "Enabling CloudKit").
    # Left off until the bundle id is finalized and the App ID / iCloud container
    # are registered — adding them requires a provisioning profile + Apple account.
    sources:
      - path: LevelSelect
        excludes:
          - "**/.DS_Store"

  LevelSelectTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests
    dependencies:
      - target: LevelSelect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LevelSelect.app/Contents/MacOS/LevelSelect"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LevelSelect:
    build:
      targets:
        LevelSelect: all
        LevelSelectTests: [test]
    test:
      targets:
        - LevelSelectTests
