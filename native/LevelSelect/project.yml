name: LevelSelect
options:
  bundleIdPrefix: com.timultuoustimes
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "GYDB3WFZB2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    PROVISIONING_PROFILE_SPECIFIER: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LevelSelect
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_NSSupportsLiveActivities: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  LevelSelect:
    type: application
    supportedDestinations: [iOS, iPadOS, macOS]
    entitlements:
      path: LevelSelect/LevelSelect.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.timultuoustimes.levelselect]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    # Explicit UILaunchScreen (stacked lockup on the navy brand color) replaces
    # the generated blank launch screen. Merged with INFOPLIST_KEY_* settings.
    info:
      path: LevelSelect/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Standard HTTPS only — skips the export-compliance question on
        # every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timultuoustimes.levelselect
    sources:
      - path: LevelSelect
        excludes:
          - "**/.DS_Store"
      - path: Shared
      # legacy-import.json under Resources/ is auto-routed to the resources
      # build phase by xcodegen (non-code file type).
    dependencies:
      - target: LevelSelectWidgets
        embed: true
        destinationFilters: [iOS]

  LevelSelectWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timultuoustimes.levelselect.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LevelSelect
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LevelSelectTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests
    dependencies:
      - target: LevelSelect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LevelSelect.app/Contents/MacOS/LevelSelect"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LevelSelect:
    build:
      targets:
        LevelSelect: all
        LevelSelectTests: [test]
    test:
      targets:
        - LevelSelectTests
