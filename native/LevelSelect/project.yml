name: LevelSelect
options:
  bundleIdPrefix: com.timultuoustimes
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "GYDB3WFZB2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    PROVISIONING_PROFILE_SPECIFIER: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LevelSelect
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_NSSupportsLiveActivities: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  LevelSelect:
    type: application
    supportedDestinations: [iOS, iPadOS, macOS]
    entitlements:
      path: LevelSelect/LevelSelect.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.timultuoustimes.levelselect]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.application-groups: [group.com.timultuoustimes.levelselect]
    # Explicit UILaunchScreen (stacked lockup on the navy brand color) replaces
    # the generated blank launch screen. Merged with INFOPLIST_KEY_* settings.
    info:
      path: LevelSelect/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Standard HTTPS only — skips the export-compliance question on
        # every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # All four orientations (App Store validation requires them for
        # iPad multitasking support).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Deep-link scheme the widgets use (levelselect://game/<id>).
        CFBundleURLTypes:
          - CFBundleURLName: com.timultuoustimes.levelselect
            CFBundleURLSchemes: [levelselect]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timultuoustimes.levelselect
    sources:
      - path: LevelSelect
        excludes:
          - "**/.DS_Store"
      - path: Shared
      # legacy-import.json under Resources/ is auto-routed to the resources
      # build phase by xcodegen (non-code file type).
    dependencies:
      - target: LevelSelectWidgets
        embed: true
        destinationFilters: [iOS]
      # LevelSelectWatch is fully scaffolded below but NOT embedded yet:
      # embedding makes the iOS build require the watchOS runtime, which isn't
      # installed on this Mac (only the build SDK is). Re-add this dependency
      # once the watchOS 26 simulator runtime is installed, then it ships with
      # the phone app.
      # - target: LevelSelectWatch
      #   embed: true
      #   destinationFilters: [iOS]

  LevelSelectWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    entitlements:
      path: Watch/LevelSelectWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.timultuoustimes.levelselect]
        com.apple.developer.icloud-services: [CloudKit]
    # Reuse the phone's data layer — same models, schema, store, Repository —
    # so the watch syncs the same iCloud data. Watch-only stubs (in Watch/)
    # satisfy Repository's iOS-only side effects.
    sources:
      - path: LevelSelect/Persistence/Models
      - path: LevelSelect/Persistence/Schema.swift
      - path: LevelSelect/Persistence/Repository.swift
      - path: LevelSelect/Domain
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timultuoustimes.levelselect.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: LevelSelect
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.timultuoustimes.levelselect
        INFOPLIST_KEY_WKApplication: YES
        GENERATE_INFOPLIST_FILE: YES

  LevelSelectWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    entitlements:
      path: Widgets/LevelSelectWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.timultuoustimes.levelselect]
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timultuoustimes.levelselect.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LevelSelect
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LevelSelectTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests
    dependencies:
      - target: LevelSelect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LevelSelect.app/Contents/MacOS/LevelSelect"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LevelSelect:
    build:
      targets:
        LevelSelect: all
        LevelSelectTests: [test]
    test:
      targets:
        - LevelSelectTests
